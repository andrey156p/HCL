<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1f2937">
    <link rel="apple-touch-icon" href="admin-192.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCL - לוח בקרה</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .tab-btn.active { border-bottom: 4px solid #4f46e5; color: #4f46e5; font-weight: bold; background-color: white;}
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #4f46e5; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* === ЭКРАННЫЙ РЕЖИМ (Прячем всё печатное) === */
        @media screen {
            .print-only { display: none !important; }
        }

        /* === ИДЕАЛЬНАЯ ПЕЧАТЬ А4 === */
        @media print {
            @page { size: A4 portrait; margin: 5mm; }
            body { background: white; margin: 0; padding: 0 !important; -webkit-print-color-adjust: exact; }
            
            /* Прячем экранный мусор (кнопки, фильтры и тд) */
            .no-print { display: none !important; }
            
            /* --- РЕЖИМ 1: ПЕЧАТЬ ЗАДАНИЙ (4 КВАДРАТА) --- */
            body.task-print-mode .manager-stuff { display: none !important; }
            body.task-print-mode .task-stuff { display: block !important; }

            .print-page {
                width: 100%;
                height: 282mm; /* Высота А4 минус поля */
                page-break-after: always;
                box-sizing: border-box;
                padding: 5mm;
                display: flex;
                flex-direction: column;
            }
            .print-page-header {
                font-size: 19px;
                font-weight: bold;
                text-align: center;
                border-bottom: 3px solid #000;
                padding-bottom: 5px;
                margin-bottom: 10px;
                height: 30px;
                overflow: hidden;
            }
            .print-cards-grid {
                display: flex;
                flex-wrap: wrap;
                justify-content: space-between;
                align-content: space-between;
                height: calc(100% - 40px); 
            }
            .print-card {
                width: 48.8%;
                height: 48.8%;
                border: 2px solid #000;
                border-radius: 10px;
                padding: 10px;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                page-break-inside: avoid;
                overflow: hidden;
            }
            .print-card-top {
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 2px solid #ccc;
                padding-bottom: 5px;
                margin-bottom: 8px;
            }
            .print-card-body {
                display: flex;
                gap: 10px;
                flex-grow: 1;
                overflow: hidden;
                align-items: flex-start;
            }
            .print-photo, .print-photo-placeholder {
                width: 80px;  /* МИНИ ФОТО */
                height: 80px; /* МИНИ ФОТО */
                flex-shrink: 0;
                object-fit: cover;
                border: 1px solid #555;
                border-radius: 6px;
            }
            .print-photo-placeholder {
                background: #eee;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #888;
                font-weight: bold;
                font-size: 12px;
                text-align: center;
            }
            .print-info {
                flex-grow: 1;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .signature-box {
                border-top: 2px dashed #000;
                margin-top: auto;
                padding-top: 5px;
                display: flex;
                justify-content: space-between;
                font-size: 13px;
                font-weight: bold;
            }

            /* --- РЕЖИМ 2: ПЕЧАТЬ ТАБЛИЦЫ РУКОВОДИТЕЛЯ --- */
            body.manager-report-mode .task-stuff { display: none !important; }
            body.manager-report-mode div.manager-stuff { display: block !important; }
            body.manager-report-mode table.manager-stuff { display: table !important; width: 100%; border-collapse: collapse; margin-top: 10mm;}
            
            body.manager-report-mode table th, body.manager-report-mode table td { border: 1px solid #000; padding: 8px; text-align: right; }
            body.manager-report-mode table th { background-color: #e5e7eb; font-weight: bold; font-size: 15px;}
            #printTitleManager { font-size: 24px; font-weight: bold; text-align: center; text-decoration: underline; margin-top: 10mm; margin-bottom: 10mm;}
        }
    </style>
</head>
<body class="text-gray-800">

    <div id="loginScreen" class="fixed inset-0 bg-gray-900 flex items-center justify-center z-50 no-print">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center">
            <i class="fas fa-lock text-indigo-600 text-5xl mb-4"></i>
            <h2 class="text-2xl font-black mb-6">כניסת מנהל</h2>
            <input type="password" id="pinCode" placeholder="קוד גישה" class="w-full p-4 mb-4 bg-gray-50 border rounded-xl text-center text-2xl font-bold tracking-widest focus:ring-2 focus:ring-indigo-500 outline-none">
            <button onclick="checkPin()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold text-lg">כניסה</button>
            <p id="pinError" class="text-red-500 font-bold mt-2 hidden">קוד שגוי!</p>
        </div>
    </div>

    <div id="loader" class="fixed inset-0 bg-white/90 hidden z-40 flex items-center justify-center no-print">
        <div class="flex flex-col items-center"><div class="loader mb-4"></div><p class="font-bold text-indigo-600">מעדכן נתונים...</p></div>
    </div>

    <div id="mainApp" class="hidden max-w-5xl mx-auto p-4 md:p-6 print:p-0 print:max-w-full">
        
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 mb-6 no-print">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 border-b pb-4">
                <h1 class="text-3xl font-black text-gray-800 mb-4 md:mb-0">לוח בקרה <span class="text-indigo-600">HCL</span></h1>
                <div class="flex gap-2 flex-wrap justify-center">
                    <button onclick="printTasks()" class="bg-gray-800 text-white px-5 py-2 rounded-xl font-bold hover:bg-gray-700"><i class="fas fa-th-large ml-2"></i>הדפסת כרטיסיות (צוות)</button>
                    <button onclick="printManagerReport()" class="bg-green-600 text-white px-5 py-2 rounded-xl font-bold hover:bg-green-500"><i class="fas fa-table ml-2"></i>דוח מנהל (טבלה)</button>
                    <button onclick="loadTasks()" class="bg-indigo-100 text-indigo-700 px-4 py-2 rounded-xl font-bold hover:bg-indigo-200"><i class="fas fa-sync-alt"></i></button>
                </div>
            </div>

            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex-1">
                    <label class="block text-sm font-bold text-gray-500 mb-1">מחלקה</label>
                    <select id="filterDept" onchange="renderTasks()" class="w-full p-3 bg-gray-50 border rounded-xl font-bold outline-none">
                        <option value="ALL">כל המחלקות</option>
                    </select>
                </div>
                <div class="flex-1">
                    <label class="block text-sm font-bold text-gray-500 mb-1">מתאריך (החל מ)</label>
                    <input type="date" id="filterDate" onchange="renderTasks()" class="w-full p-3 bg-gray-50 border rounded-xl font-bold outline-none">
                </div>
                <div class="flex items-end">
                    <button onclick="resetFilters()" class="w-full md:w-auto px-6 py-3 bg-red-100 text-red-600 rounded-xl font-bold hover:bg-red-200">נקה סינון</button>
                </div>
            </div>
        </div>

        <div class="flex bg-white rounded-2xl shadow-sm mb-6 overflow-hidden no-print flex-wrap md:flex-nowrap">
            <button onclick="switchTab('חשמל')" id="tab-חשמל" class="tab-btn active flex-1 py-4 px-2 font-bold text-gray-500 bg-gray-50 hover:bg-gray-100"><i class="fas fa-bolt text-yellow-500 ml-2"></i>חשמל</button>
            <button onclick="switchTab('בינוי_ודלתות')" id="tab-בינוי_ודלתות" class="tab-btn flex-1 py-4 px-2 font-bold text-gray-500 bg-gray-50 hover:bg-gray-100"><i class="fas fa-hammer text-orange-500 ml-2"></i>בינוי ודלתות</button>
            <button onclick="switchTab('מיטות')" id="tab-מיטות" class="tab-btn flex-1 py-4 px-2 font-bold text-gray-500 bg-gray-50 hover:bg-gray-100"><i class="fas fa-bed text-purple-500 ml-2"></i>מיטות</button>
            <button onclick="switchTab('ליקויים')" id="tab-ליקויים" class="tab-btn flex-1 py-4 px-2 font-bold text-gray-500 bg-gray-50 hover:bg-gray-100"><i class="fas fa-clipboard-list text-blue-500 ml-2"></i>ליקויים (כללי)</button>
        </div>

        <div class="print-only manager-stuff" id="printTitleManager"></div>
        <table id="managerTable" class="print-only manager-stuff">
            <thead>
                <tr>
                    <th>תאריך פתיחה</th>
                    <th>מחלקה</th>
                    <th>חדר</th>
                    <th>מהות הליקוי</th>
                    <th>פעולה נדרשת</th>
                    <th>אישור ביצוע / הערות</th>
                </tr>
            </thead>
            <tbody id="managerTableBody"></tbody>
        </table>

        <div id="screenTasksContainer" class="space-y-4 no-print"></div>

        <div id="printTasksContainer" class="print-only task-stuff"></div>

    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxMN6s8ektwhHxuE_8xDz1ZaeqYyXaLyniwi_xFpbzVEjFEo_AUd6PybJk6nGKxmy7E/exec";
        let allTasks = [];
        let currentTab = "חשמל";

        function checkPin() {
            if(document.getElementById('pinCode').value === "1234") { 
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                loadTasks();
            } else { document.getElementById('pinError').classList.remove('hidden'); }
        }

        function fixImageUrl(url) {
            if(!url) return "";
            if(url.includes('/view')) {
                const match = url.match(/d\/([a-zA-Z0-9-_]+)/);
                if(match) return `https://drive.google.com/uc?export=view&id=${match[1]}`;
            }
            return url;
        }

        function escapeString(str) {
            if (!str) return "";
            return String(str).replace(/\\/g, "\\\\").replace(/"/g, "&quot;").replace(/'/g, "\\'");
        }

        async function loadTasks() {
            document.getElementById('loader').classList.remove('hidden');
            try {
                const res = await fetch(`${API_URL}?action=getOpenTasks`);
                const data = await res.json();
                allTasks = data.tasks || [];
                
                const depts = [...new Set(allTasks.map(t => t.dept))].filter(Boolean);
                const select = document.getElementById('filterDept');
                select.innerHTML = '<option value="ALL">כל המחלקות</option>';
                depts.forEach(d => select.innerHTML += `<option value="${d}">${d}</option>`);

                renderTasks();
            } catch(e) { alert("שגיאה בטעינת נתונים!"); }
            document.getElementById('loader').classList.add('hidden');
        }

        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active', 'bg-white'));
            document.getElementById('tab-' + tabName).classList.add('active', 'bg-white');
            renderTasks();
        }

        function resetFilters() {
            document.getElementById('filterDept').value = "ALL";
            document.getElementById('filterDate').value = "";
            renderTasks();
        }

        function renderTasks() {
            const screenContainer = document.getElementById('screenTasksContainer');
            const printContainer = document.getElementById('printTasksContainer');
            const tbody = document.getElementById('managerTableBody');
            
            screenContainer.innerHTML = '';
            printContainer.innerHTML = '';
            tbody.innerHTML = '';
            
            const filterDept = document.getElementById('filterDept').value;
            const filterDate = document.getElementById('filterDate').value;

            let filtered = allTasks.filter(t => t.sheet === currentTab);
            if(filterDept !== "ALL") { filtered = filtered.filter(t => t.dept === filterDept); }
            if(filterDate) {
                const selectedDate = new Date(filterDate);
                filtered = filtered.filter(t => {
                    const parts = t.dateStr.split(" ")[0].split("/"); 
                    if(parts.length === 3) {
                        const taskDate = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
                        return taskDate >= selectedDate;
                    }
                    return true;
                });
            }
            
            if(filtered.length === 0) {
                screenContainer.innerHTML = '<div class="text-center p-10 text-gray-400 font-bold bg-white rounded-2xl"><i class="fas fa-check-circle text-5xl mb-4"></i><p>אין משימות פתוחות לסינון זה!</p></div>';
                return;
            }

            let groupsForPrint = {};
            
            filtered.forEach((task, index) => {
                const actionColor = task.actionType == 1 ? "text-red-600 bg-red-100" : "text-orange-600 bg-orange-100";
                const actionText = task.actionType == 1 ? "החלפה" : "תיקון";
                const cleanPic = fixImageUrl(task.photo);
                const displayDate = task.dateStr.split(" ")[0]; 
                
                const safeSheet = escapeString(task.sheet);
                const safeDateStr = escapeString(task.dateStr);
                const safeRoom = escapeString(task.room);
                const safeDefect = escapeString(task.defect);

                // ОТРИСОВКА НА ЭКРАНЕ
                const screenPhotoHtml = cleanPic ? `<a href="${cleanPic}" target="_blank"><img src="${cleanPic}" class="w-24 h-24 object-cover rounded-xl border"></a>` : `<div class="w-24 h-24 bg-gray-100 rounded-xl border flex items-center justify-center text-gray-400"><i class="fas fa-image text-2xl"></i></div>`;
                screenContainer.innerHTML += `
                <div class="task-card bg-white p-5 rounded-2xl shadow-sm border border-gray-200 flex flex-col md:flex-row gap-5">
                    <div class="flex-shrink-0 flex justify-center">${screenPhotoHtml}</div>
                    <div class="flex-grow">
                        <div class="flex justify-between items-start mb-2 border-b pb-2">
                            <h3 class="text-xl font-black text-gray-800">${task.dept} <span class="text-gray-400 mx-2">|</span> חדר: <span class="text-indigo-600">${task.room}</span></h3>
                            <span class="px-3 py-1 rounded-lg font-bold text-sm ${actionColor}">${actionText}</span>
                        </div>
                        <p class="font-bold text-lg mb-1"><i class="fas fa-wrench text-gray-400 ml-2"></i>${task.defect}</p>
                        ${task.comment ? `<p class="text-gray-600 mb-2"><i class="fas fa-comment-alt text-gray-400 ml-2"></i>${task.comment}</p>` : ''}
                        <p class="text-xs text-gray-400 mt-2"><i class="fas fa-calendar-alt ml-1"></i> נפתח: ${displayDate}</p>
                    </div>
                    <div class="flex items-center justify-center min-w-[140px]">
                        <button id="btn-${index}" onclick="closeTask('${safeSheet}', '${safeDateStr}', '${safeRoom}', '${safeDefect}', ${index})" class="w-full bg-green-50 text-green-600 border-2 border-green-500 py-3 rounded-xl font-bold hover:bg-green-500 hover:text-white transition-colors flex justify-center items-center gap-2">
                            <i class="fas fa-check"></i> סיום טיפול
                        </button>
                    </div>
                </div>`;

                // ТАБЛИЦА РУКОВОДИТЕЛЯ
                tbody.innerHTML += `
                <tr>
                    <td>${displayDate}</td>
                    <td class="font-bold">${task.dept}</td>
                    <td>${task.room}</td>
                    <td>${task.defect}</td>
                    <td class="${task.actionType == 1 ? 'text-red-600' : 'text-orange-600'} font-bold">${actionText}</td>
                    <td class="w-40"></td>
                </tr>`;

                // СБОР ДЛЯ ПЕЧАТИ 2x2
                let groupKey = `${task.dept}|${displayDate}`;
                if(!groupsForPrint[groupKey]) groupsForPrint[groupKey] = [];
                groupsForPrint[groupKey].push({...task, actionText, cleanPic});
            });

            // ГЕНЕРАЦИЯ ЛИСТОВ А4 (Строго 4 квадрата)
            for(let key in groupsForPrint) {
                let groupTasks = groupsForPrint[key];
                let dept = groupTasks[0].dept;
                let date = groupTasks[0].dateStr.split(" ")[0];

                for(let i=0; i < groupTasks.length; i+=4) {
                    let chunk = groupTasks.slice(i, i+4);
                    
                    let pageHtml = `
                    <div class="print-page">
                        <div class="print-page-header">צוות: ${currentTab} | מחלקה: ${dept} | תאריך בדיקה: ${date}</div>
                        <div class="print-cards-grid">
                    `;
                    
                    chunk.forEach(task => {
                        const photoHtml = task.cleanPic ? `<img src="${task.cleanPic}" class="print-photo">` : `<div class="print-photo-placeholder">אין תמונה</div>`;
                        pageHtml += `
                        <div class="print-card">
                            <div class="print-card-top">
                                <span class="font-black text-xl">חדר: ${task.room}</span>
                                <span class="font-bold text-lg px-3 py-1 border-2 border-gray-800 rounded-lg bg-gray-100">${task.actionText}</span>
                            </div>
                            <div class="print-card-body">
                                ${photoHtml}
                                <div class="print-info">
                                    <p class="font-black text-lg mb-1 leading-tight">${task.defect}</p>
                                    ${task.comment ? `<p class="text-sm text-gray-700 leading-tight">${task.comment}</p>` : ''}
                                </div>
                            </div>
                            <div class="signature-box">
                                <span>שם: ____________</span>
                                <span>תאריך: ____________</span>
                                <span>חתימה: ____________</span>
                            </div>
                        </div>`;
                    });
                    
                    pageHtml += `</div></div>`;
                    printContainer.innerHTML += pageHtml;
                }
            }
        }

        async function closeTask(sheet, dateStr, room, defect, index) {
            if(!confirm("לסגור משימה זו ולהעביר לסטטוס 'סגור'?")) return;
            
            const btn = document.getElementById(`btn-${index}`);
            const originalHtml = btn.innerHTML;
            
            btn.innerHTML = '<i class="fas fa-lock"></i> נסגר';
            btn.className = "w-full bg-gray-200 text-gray-500 border-2 border-gray-200 py-3 rounded-xl font-bold cursor-not-allowed flex justify-center items-center gap-2";
            btn.disabled = true;
            document.getElementById(`btn-${index}`).closest('.task-card').classList.add('opacity-50');
            
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "CLOSE_TASK", sheetName: sheet, date: dateStr, room: room, defect: defect })
                });
                
                const out = await res.json();
                if(out.status === "success") {
                    allTasks = allTasks.filter(t => !(t.sheet === sheet && t.dateStr === dateStr && t.room == room && t.defect === defect));
                } else { throw new Error(); }
            } catch(e) { 
                alert("שגיאת תקשורת! לא נשמר."); 
                btn.innerHTML = originalHtml;
                btn.className = "w-full bg-green-50 text-green-600 border-2 border-green-500 py-3 rounded-xl font-bold hover:bg-green-500 hover:text-white transition-colors flex justify-center items-center gap-2";
                btn.disabled = false;
                document.getElementById(`btn-${index}`).closest('.task-card').classList.remove('opacity-50');
            }
        }

        // ПЕРЕКЛЮЧЕНИЕ РЕЖИМОВ ПЕЧАТИ (БЕЗ ТАЙМЕРОВ!)
        function printTasks() {
            document.body.classList.remove('manager-report-mode');
            document.body.classList.add('task-print-mode');
            window.print();
        }

        function printManagerReport() {
            document.body.classList.remove('task-print-mode');
            document.body.classList.add('manager-report-mode');
            document.getElementById('printTitleManager').innerText = `דוח מנהל (תקלות פתוחות) - צוות ${currentTab}`;
            window.print();
        }
    </script>
</body>
</html>
