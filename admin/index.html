
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления HCL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .tab-btn.active { border-bottom: 4px solid #4f46e5; color: #4f46e5; font-weight: bold; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #4f46e5; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Стили для PDF печати */
        @media print {
            body { background: white; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .task-card { break-inside: avoid; border: 1px solid #000; box-shadow: none; margin-bottom: 10px; }
            .print-header { font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 20px; }
            .print-photo { width: 100px; height: 100px; object-fit: cover; border: 1px solid #ccc; }
            .signature-box { border-top: 1px dashed #000; margin-top: 20px; padding-top: 10px; text-align: left; }
        }
    </style>
</head>
<body class="text-gray-800">

    <div id="loginScreen" class="fixed inset-0 bg-gray-900 flex items-center justify-center z-50 no-print">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center">
            <i class="fas fa-lock text-indigo-600 text-5xl mb-4"></i>
            <h2 class="text-2xl font-black mb-6">Админ-панель</h2>
            <input type="password" id="pinCode" placeholder="Введите PIN-код" class="w-full p-4 mb-4 bg-gray-50 border rounded-xl text-center text-2xl font-bold tracking-widest focus:ring-2 focus:ring-indigo-500 outline-none">
            <button onclick="checkPin()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold text-lg">Войти</button>
            <p id="pinError" class="text-red-500 font-bold mt-2 hidden">Неверный PIN-код!</p>
        </div>
    </div>

    <div id="loader" class="fixed inset-0 bg-white/90 hidden z-40 flex items-center justify-center no-print">
        <div class="flex flex-col items-center"><div class="loader mb-4"></div><p class="font-bold text-indigo-600">Синхронизация...</p></div>
    </div>

    <div id="mainApp" class="hidden max-w-5xl mx-auto p-4 md:p-6 print:p-0 print:max-w-full">
        
        <div class="flex justify-between items-center mb-6 no-print">
            <h1 class="text-3xl font-black text-gray-800">Задания <span class="text-indigo-600">HCL</span></h1>
            <div class="flex gap-2">
                <button onclick="window.print()" class="bg-gray-800 text-white px-6 py-3 rounded-xl font-bold hover:bg-gray-700 shadow-lg"><i class="fas fa-print mr-2"></i> Печать (PDF)</button>
                <button onclick="loadTasks()" class="bg-indigo-100 text-indigo-700 px-4 py-3 rounded-xl font-bold hover:bg-indigo-200"><i class="fas fa-sync-alt"></i></button>
            </div>
        </div>

        <div class="hidden print-only print-header">רשימת משימות - HCL תחזוקה</div>

        <div class="flex bg-white rounded-2xl shadow-sm mb-6 overflow-hidden no-print">
            <button onclick="switchTab('חשמל')" id="tab-חשמל" class="tab-btn active flex-1 py-4 font-bold text-gray-500 bg-gray-50 hover:bg-gray-100"><i class="fas fa-bolt text-yellow-500 ml-2"></i>חשמל</button>
            <button onclick="switchTab('בינוי_ודלתות')" id="tab-בינוי_ודלתות" class="tab-btn flex-1 py-4 font-bold text-gray-500 bg-gray-50 hover:bg-gray-100"><i class="fas fa-hammer text-orange-500 ml-2"></i>בינוי ודלתות</button>
            <button onclick="switchTab('ליקויים')" id="tab-ליקויים" class="tab-btn flex-1 py-4 font-bold text-gray-500 bg-gray-50 hover:bg-gray-100"><i class="fas fa-clipboard-list text-blue-500 ml-2"></i>ליקויים (כללי)</button>
        </div>

        <div id="tasksContainer" class="space-y-4"></div>

    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxMN6s8ektwhHxuE_8xDz1ZaeqYyXaLyniwi_xFpbzVEjFEo_AUd6PybJk6nGKxmy7E/exec";
        let allTasks = [];
        let currentTab = "חשמל";

        function checkPin() {
            const pin = document.getElementById('pinCode').value;
            if(pin === "1234") { // ПАРОЛЬ ДЛЯ ВХОДА (можете поменять)
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                loadTasks();
            } else {
                document.getElementById('pinError').classList.remove('hidden');
            }
        }

        async function loadTasks() {
            document.getElementById('loader').classList.remove('hidden');
            try {
                const res = await fetch(`${API_URL}?action=getOpenTasks`);
                const data = await res.json();
                allTasks = data.tasks || [];
                renderTasks();
            } catch(e) { alert("Ошибка загрузки данных!"); }
            document.getElementById('loader').classList.add('hidden');
        }

        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active', 'bg-white'));
            document.getElementById('tab-' + tabName).classList.add('active', 'bg-white');
            renderTasks();
        }

        function renderTasks() {
            const container = document.getElementById('tasksContainer');
            container.innerHTML = '';
            
            const filtered = allTasks.filter(t => t.sheet === currentTab);
            
            if(filtered.length === 0) {
                container.innerHTML = '<div class="text-center p-10 text-gray-400 font-bold"><i class="fas fa-check-circle text-5xl mb-4"></i><p>Все задания выполнены!</p></div>';
                return;
            }

            filtered.forEach((task, index) => {
                const actionColor = task.actionType == 1 ? "text-red-600 bg-red-100" : "text-orange-600 bg-orange-100";
                const actionText = task.actionType == 1 ? "החלפה" : "תיקון";
                const photoHtml = task.photo ? `<a href="${task.photo}" target="_blank" class="no-print"><img src="${task.photo}" class="w-20 h-20 object-cover rounded-xl border"></a> <img src="${task.photo}" class="hidden print-only print-photo">` : `<div class="w-20 h-20 bg-gray-100 rounded-xl border flex items-center justify-center text-gray-400"><i class="fas fa-image"></i></div>`;

                const html = `
                <div class="task-card bg-white p-5 rounded-2xl shadow-sm border border-gray-200 flex flex-col md:flex-row gap-4" id="task-${index}">
                    <div class="flex-shrink-0">${photoHtml}</div>
                    
                    <div class="flex-grow">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="text-xl font-black text-gray-800">${task.dept} | חדר: <span class="text-indigo-600">${task.room}</span></h3>
                            <span class="px-3 py-1 rounded-lg font-bold text-sm ${actionColor}">${actionText}</span>
                        </div>
                        <p class="font-bold text-lg mb-1"><i class="fas fa-wrench text-gray-400 ml-2"></i>${task.defect}</p>
                        <p class="text-gray-600 mb-2"><i class="fas fa-comment-alt text-gray-400 ml-2"></i>${task.comment}</p>
                        <p class="text-xs text-gray-400">נפתח: ${task.date}</p>
                        
                        <div class="hidden print-only signature-box">
                            <div class="flex justify-between mt-2">
                                <span>שם המבצע: ____________</span>
                                <span>חתימה: ____________</span>
                                <span>תאריך: ____________</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-center min-w-[150px] no-print">
                        <button onclick="closeTask('${task.sheet}', '${task.date}', '${task.room}', '${task.defect}', ${index})" class="w-full bg-green-50 text-green-600 border-2 border-green-500 py-3 rounded-xl font-bold hover:bg-green-500 hover:text-white transition-colors">
                            <i class="fas fa-check mr-2"></i> בוצע
                        </button>
                    </div>
                </div>`;
                container.innerHTML += html;
            });
        }

        async function closeTask(sheet, date, room, defect, index) {
            if(!confirm("Отметить задание как выполненное?")) return;
            
            // Визуально прячем карточку сразу
            document.getElementById(`task-${index}`).style.opacity = '0.5';
            
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: "CLOSE_TASK",
                        sheetName: sheet,
                        date: date,
                        room: room,
                        defect: defect
                    })
                });
                
                const out = await res.json();
                if(out.status === "success") {
                    // Удаляем из локального массива и перерисовываем
                    allTasks = allTasks.filter(t => !(t.sheet === sheet && t.date === date && t.room == room && t.defect === defect));
                    renderTasks();
                } else { alert("Ошибка сохранения!"); }
            } catch(e) { alert("Ошибка связи!"); document.getElementById(`task-${index}`).style.opacity = '1'; }
        }
    </script>
</body>
</html>
