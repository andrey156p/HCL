<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCL Инспектор</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .page { display: none; } .page.active { display: block; }
        .loader-overlay { background: rgba(255,255,255,0.9); z-index: 100; }
        .error-shake { animation: shake 0.4s; border-color: #ef4444 !important; background-color: #fef2f2 !important; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }
        .status-btn.selected { ring: 4px; ring-color: #6366f1; transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="loader" class="fixed inset-0 flex flex-col items-center justify-center hidden loader-overlay">
        <div class="loader border-4 border-indigo-500 border-t-transparent rounded-full w-12 h-12 animate-spin"></div>
        <p class="mt-4 font-bold text-indigo-700">Обработка...</p>
    </div>

    <div id="msgBox" class="fixed inset-0 bg-black/50 hidden z-[200] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl">
            <i id="msgIcon" class="fas fa-exclamation-circle text-4xl mb-4"></i>
            <p id="msgText" class="text-lg font-bold mb-6"></p>
            <button onclick="closeMsg()" class="w-full bg-gray-900 text-white py-4 rounded-2xl font-bold">ОК</button>
        </div>
    </div>

    <div id="setupPage" class="page active p-6 max-w-lg mx-auto mt-10">
        <div class="bg-white p-8 rounded-3xl shadow-xl">
            <h1 class="text-3xl font-black text-center mb-8">Инспекция ג 2</h1>
            <input type="text" id="inspectorName" placeholder="Имя инспектора" class="w-full p-4 mb-4 bg-gray-50 border rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500">
            <input type="text" id="department" placeholder="Отделение" class="w-full p-4 mb-8 bg-gray-50 border rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500">
            <button onclick="start()" class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-bold text-xl shadow-lg">Начать работу</button>
        </div>
    </div>

    <div id="inspectionPage" class="page p-4 max-w-3xl mx-auto">
        <div class="flex justify-between items-center bg-white p-4 rounded-3xl shadow-sm mb-4">
            <span id="info" class="font-bold text-indigo-600"></span>
            <button onclick="location.reload()" class="text-red-500 p-2"><i class="fas fa-power-off"></i></button>
        </div>

        <div class="bg-white p-4 rounded-3xl shadow-sm mb-6">
            <div class="flex gap-2">
                <input type="text" id="roomName" placeholder="Номер помещения" class="flex-1 p-4 bg-gray-50 border rounded-2xl outline-none">
                <button onclick="openRoom()" class="bg-indigo-600 text-white px-8 rounded-2xl font-bold">ОК</button>
            </div>
        </div>

        <div id="roomWorkArea" class="hidden">
            <div id="issuesList" class="space-y-4"></div>
            <button onclick="addRow()" class="w-full py-4 mt-4 border-2 border-dashed border-indigo-300 text-indigo-500 rounded-2xl font-bold"><i class="fas fa-plus mr-2"></i>Добавить поломку</button>
            <button id="saveBtn" onclick="save()" class="w-full py-5 mt-6 bg-indigo-800 text-white rounded-3xl font-black text-xl shadow-xl hidden">Сохранить всё в таблицу</button>
        </div>

        <button onclick="finish()" class="w-full py-5 mt-20 bg-red-600 text-white rounded-3xl font-black text-xl shadow-xl">Завершить обход</button>
    </div>

    <template id="rowTemp">
        <div class="row bg-white rounded-3xl shadow-md border-l-8 border-indigo-500 overflow-hidden transition-all">
            <div class="row-header p-4 flex justify-between items-center bg-indigo-50 cursor-pointer" onclick="toggleRow(this)">
                <span class="row-title font-bold text-indigo-800">Новая запись...</span>
                <button onclick="this.closest('.row').remove(); checkEmpty()" class="text-red-400 p-2"><i class="fas fa-times"></i></button>
            </div>
            <div class="row-body p-5 space-y-4">
                <select class="sys w-full p-4 bg-gray-50 border rounded-xl font-bold outline-none">
                    <option value="" disabled selected>Что сломано?</option>
                    <option value="חשמל">Электрика</option>
                    <option value="דלת">Дверь / Косяк</option>
                    <option value="תקרה">Потолок</option>
                    <option value="קיר">Стена / Покраска</option>
                    <option value="ריצפה">Пол</option>
                    <option value="OTHER">Другое...</option>
                </select>
                <input type="text" class="custom-sys hidden w-full p-4 border rounded-xl" placeholder="Назовите систему">
                
                <div class="flex gap-2 rating">
                    <button onclick="setR(this, 2)" class="flex-1 py-3 bg-orange-400 text-white rounded-xl font-bold">Ремонт</button>
                    <button onclick="setR(this, 1)" class="flex-1 py-3 bg-red-600 text-white rounded-xl font-bold">Замена</button>
                </div>

                <div class="flex gap-2">
                    <textarea class="comm flex-1 p-4 bg-gray-50 border rounded-xl outline-none" placeholder="Комментарий"></textarea>
                    <label class="w-20 bg-gray-100 rounded-xl flex flex-col items-center justify-center border cursor-pointer">
                        <i class="fas fa-camera text-gray-400 text-2xl"></i>
                        <input type="file" accept="image/*" capture="environment" class="hidden photo" onchange="hPhoto(this)">
                    </label>
                </div>
                
                <button onclick="validateAndCollapse(this)" class="done-btn w-full py-4 bg-gray-200 text-gray-600 rounded-xl font-black transition-colors">ГОТОВО (СВЕРНУТЬ)</button>
            </div>
        </div>
    </template>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbxMN6s8ektwhHxuE_8xDz1ZaeqYyXaLyniwi_xFpbzVEjFEo_AUd6PybJk6nGKxmy7E/exec";
        let state = { ins: '', dept: '', room: '', results: {} };

        function showMsg(t, err=false) {
            document.getElementById('msgIcon').className = err ? "fas fa-times-circle text-red-500" : "fas fa-check-circle text-green-500";
            document.getElementById('msgText').innerText = t;
            document.getElementById('msgBox').classList.remove('hidden');
        }
        function closeMsg() { document.getElementById('msgBox').classList.add('hidden'); }

        function start() {
            state.ins = document.getElementById('inspectorName').value;
            state.dept = document.getElementById('department').value;
            if(!state.ins || !state.dept) return showMsg("Заполните профиль!", true);
            document.getElementById('info').innerText = state.ins + " | " + state.dept;
            document.getElementById('setupPage').classList.remove('active');
            document.getElementById('inspectionPage').classList.add('active');
        }

        function openRoom() {
            state.room = document.getElementById('roomName').value;
            if(!state.room) return;
            document.getElementById('roomWorkArea').classList.remove('hidden');
            document.getElementById('issuesList').innerHTML = '';
            document.getElementById('saveBtn').classList.add('hidden');
        }

        function addRow() {
            const temp = document.getElementById('rowTemp').content.cloneNode(true);
            document.getElementById('issuesList').appendChild(temp);
            document.getElementById('saveBtn').classList.remove('hidden');
        }

        function setR(btn, v) {
            const p = btn.closest('.rating');
            p.dataset.val = v;
            p.querySelectorAll('button').forEach(b => b.style.opacity = '0.3');
            btn.style.opacity = '1';
        }

        function validateAndCollapse(btn) {
            const row = btn.closest('.row');
            const sys = row.querySelector('.sys').value;
            const rat = row.querySelector('.rating').dataset.val;
            const comm = row.querySelector('.comm').value;

            let err = false;
            if(!sys) { row.querySelector('.sys').classList.add('error-shake'); err = true; }
            if(!rat) { row.querySelector('.rating').classList.add('error-shake'); err = true; }
            if(!comm) { row.querySelector('.comm').classList.add('error-shake'); err = true; }

            if(err) { btn.classList.add('bg-red-500', 'text-white'); return; }

            // Если всё ок
            btn.classList.remove('bg-red-500');
            btn.classList.add('bg-green-500', 'text-white');
            row.querySelector('.row-title').innerText = "✅ " + sys;
            row.querySelector('.row-body').classList.add('hidden');
            row.classList.replace('border-indigo-500', 'border-green-500');
        }

        function toggleRow(header) {
            const body = header.nextElementSibling;
            body.classList.toggle('hidden');
        }

        async function save() {
            const items = [];
            const rows = document.querySelectorAll('.row');
            for(let r of rows) {
                if(r.querySelector('.row-body').classList.contains('hidden')) {
                    items.push({
                        name: r.querySelector('.sys').value,
                        score: r.querySelector('.rating').dataset.val,
                        comment: r.querySelector('.comm').value,
                        photoBase64: r.querySelector('.photo').dataset.b64 || ""
                    });
                } else { return showMsg("Сначала сверните все карточки!", true); }
            }

            document.getElementById('loader').classList.remove('hidden');
            try {
                await fetch(API, { method: 'POST', body: JSON.stringify({ inspector: state.ins, department: state.dept, room: state.room, items: items }) });
                state.results[state.room] = items;
                showMsg("Сохранено!");
                document.getElementById('roomWorkArea').classList.add('hidden');
                document.getElementById('roomName').value = '';
            } catch(e) { showMsg("Ошибка сети!", true); }
            document.getElementById('loader').classList.add('hidden');
        }

        function hPhoto(inp) {
            const file = inp.files[0];
            const reader = new FileReader();
            reader.onload = (e) => { inp.dataset.b64 = e.target.result; inp.closest('label').classList.add('bg-green-100'); };
            reader.readAsDataURL(file);
        }

        async function finish() {
            if(!Object.keys(state.results).length) return showMsg("Нет данных!", true);
            document.getElementById('loader').classList.remove('hidden');
            const report = "Отчет завершен инспектором " + state.ins;
            await fetch(API, { method: 'POST', body: JSON.stringify({ action: "FINISH_DEPT", reportText: report }) });
            showMsg("Отправлено в ТГ!");
            location.reload();
        }
    </script>
</body>
</html>
