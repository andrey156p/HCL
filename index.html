<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HCL Инспектор</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .page { display: none; }
        .page.active { display: block; }
        .loader-overlay { background: rgba(255,255,255,0.9); z-index: 100; }
        .status-btn.selected { border-width: 3px; border-color: #1f2937; transform: scale(0.98); }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #4f46e5; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error-shake { animation: shake 0.4s; border-color: #ef4444 !important; background-color: #fef2f2 !important; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }
    </style>
</head>
<body class="text-gray-800">

    <div id="loader" class="fixed inset-0 flex flex-col items-center justify-center hidden loader-overlay">
        <div class="loader"></div>
        <p class="mt-4 text-gray-700 font-bold text-lg" id="loaderText">Синхронизация...</p>
    </div>

    <div id="customAlert" class="fixed inset-0 bg-gray-900/60 hidden z-[200] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center">
            <i class="fas fa-exclamation-triangle text-red-500 text-4xl mb-4"></i>
            <p id="customAlertText" class="text-gray-800 font-bold text-lg mb-6"></p>
            <button onclick="closeAppAlert()" class="w-full bg-gray-900 text-white py-4 rounded-xl font-black">ОК</button>
        </div>
    </div>

    <div id="customConfirm" class="fixed inset-0 bg-gray-900/60 hidden z-[200] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center">
            <i class="fas fa-question-circle text-indigo-600 text-4xl mb-4"></i>
            <p id="customConfirmText" class="text-gray-800 font-bold text-lg mb-6"></p>
            <div class="flex gap-3">
                <button onclick="resolveConfirm(false)" class="flex-1 bg-gray-100 py-4 rounded-xl font-bold">Отмена</button>
                <button onclick="resolveConfirm(true)" class="flex-1 bg-indigo-600 text-white py-4 rounded-xl font-bold">Да</button>
            </div>
        </div>
    </div>

    <div id="setupPage" class="page active p-4 max-w-lg mx-auto mt-6">
        <div class="bg-white p-8 rounded-3xl shadow-lg text-center">
            <i class="fas fa-hospital-user fa-4x text-indigo-500 mb-4"></i>
            <h1 class="text-3xl font-black mb-6">Инспекция Систем</h1>
            <input type="text" id="inspectorName" placeholder="ФИО инспектора" class="w-full px-4 py-4 mb-4 bg-gray-50 border rounded-xl text-lg font-bold">
            <input type="text" id="department" placeholder="Отделение (напр. A 1)" class="w-full px-4 py-4 mb-6 bg-gray-50 border rounded-xl text-lg font-bold">
            <button onclick="startInspection()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-black text-xl shadow-md active:scale-95 transition-transform">Начать</button>
        </div>
    </div>

    <div id="inspectionPage" class="page p-3 max-w-3xl mx-auto">
        <div class="bg-white p-5 rounded-3xl shadow-sm mb-4 flex justify-between items-center">
            <div>
                <h2 class="text-xl font-black">Проверка помещений</h2>
                <p class="text-sm text-indigo-600 font-bold" id="headerInfo"></p>
            </div>
            <button onclick="confirmExit()" class="bg-red-50 text-red-600 p-3 rounded-xl"><i class="fas fa-sign-out-alt fa-lg"></i></button>
        </div>
        
        <div class="bg-white p-5 rounded-3xl shadow-sm mb-4">
            <div class="flex gap-2">
                <input type="text" id="roomName" placeholder="Номер комнаты" class="flex-1 px-4 py-4 bg-gray-50 border rounded-xl font-bold text-xl">
                <button onclick="openRoom()" class="px-6 bg-indigo-600 text-white rounded-xl font-black text-xl">ОК</button>
            </div>
        </div>

        <div id="activeRoomBlock" class="hidden">
            <div class="bg-indigo-600 text-white p-4 rounded-2xl shadow-md mb-4 flex justify-between items-center">
                <h3 class="text-xl font-black">חדר: <span id="currentRoomDisplay" class="text-yellow-300"></span></h3>
            </div>

            <button id="allGoodBtn" onclick="saveRoomData(true)" class="w-full bg-green-500 text-white py-5 rounded-2xl shadow-md font-black text-xl mb-4 active:scale-95 flex justify-center items-center gap-2">
                <i class="fas fa-check-circle"></i> הכל תקין בחדר
            </button>
            
            <div id="issuesList" class="space-y-4 mb-4"></div>

            <button onclick="addIssueRow()" class="w-full bg-white border-2 border-dashed border-indigo-400 text-indigo-600 py-4 rounded-2xl mb-4 font-bold active:scale-95">
                <i class="fas fa-plus-circle mx-2"></i> הוסף תקלה
            </button>

            <button id="saveRoomBtn" onclick="saveRoomData(false)" class="hidden w-full bg-indigo-800 text-white py-5 rounded-2xl shadow-md font-black text-xl active:scale-95 flex justify-center items-center gap-2">
                <i class="fas fa-save"></i> שמור תקלות חדר
            </button>
        </div>

        <div class="bg-white p-5 rounded-3xl shadow-sm mt-8 mb-6">
            <h4 class="text-xs font-black text-gray-400 uppercase mb-3">נבדקו כבר:</h4>
            <div id="inspectedRoomsList" class="flex flex-wrap gap-2 text-sm font-bold"></div>
            <div id="roomDetailsDisplay" class="hidden mt-4 bg-indigo-50 p-4 rounded-xl border"></div>
        </div>

        <button onclick="finishDepartment()" class="w-full bg-red-600 text-white py-5 rounded-3xl font-black text-xl shadow-lg active:scale-95">
            <i class="fas fa-flag-checkered mx-2"></i> סיים בדיקת מחלקה
        </button>
    </div>

    <template id="issueTemplate">
        <div class="issue-row bg-white rounded-2xl border-l-4 border-indigo-500 shadow-md mb-4">
            <div class="issue-header p-4 flex justify-between items-center cursor-pointer bg-indigo-50 rounded-t-2xl" onclick="toggleIssue(this, event)">
                <div class="font-bold text-indigo-700 issue-title"><i class="fas fa-edit mr-2"></i> <span class="title-text">תקלה חדשה...</span></div>
                <button onclick="removeIssue(this, event)" class="text-red-500 bg-red-50 w-8 h-8 rounded-full"><i class="fas fa-trash-alt"></i></button>
            </div>
            <div class="issue-body p-5 border-t">
                <select class="system-select w-full p-4 mb-4 bg-gray-50 border rounded-xl font-bold text-lg" onchange="toggleCustomInput(this); updateIssueTitle(this)"></select>
                <input type="text" class="custom-system-input hidden w-full p-4 mb-4 border rounded-xl font-bold text-lg">
                
                <div class="rating-block flex gap-3 mb-4">
                    <button data-v="2" class="status-btn flex-1 py-3 rounded-xl bg-orange-500 text-white font-bold" onclick="setRating(this, 2); updateIssueTitle(this)">תיקון</button>
                    <button data-v="1" class="status-btn flex-1 py-3 rounded-xl bg-red-600 text-white font-bold" onclick="setRating(this, 1); updateIssueTitle(this)">החלפה</button>
                </div>
                
                <textarea class="comment-text w-full p-4 border rounded-xl font-bold mb-4" rows="2" placeholder="תיאור התקלה..."></textarea>
                <label class="w-full p-4 bg-gray-50 border rounded-xl flex items-center justify-center gap-3 font-bold cursor-pointer">
                    <i class="fas fa-camera text-2xl"></i> צלם תמונה
                    <input type="file" accept="image/*" capture="environment" class="hidden photo-input" onchange="handlePhoto(this)">
                </label>
                <div class="photo-indicator hidden text-green-600 font-bold text-center mt-2">✓ תמונה צולמה</div>
            </div>
        </div>
    </template>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxMN6s8ektwhHxuE_8xDz1ZaeqYyXaLyniwi_xFpbzVEjFEo_AUd6PybJk6nGKxmy7E/exec";
        let state = { inspector: '', department: '', currentRoom: '', inspectedRooms: {}, categories: {}, isRunning: false };

        function vibrate(t='light') { if(!navigator.vibrate) return; navigator.vibrate(t==='light'?30:60); }
        function appAlert(m) { vibrate('error'); document.getElementById('customAlertText').innerText = m; document.getElementById('customAlert').classList.remove('hidden'); }
        function closeAppAlert() { document.getElementById('customAlert').classList.add('hidden'); }

        let confirmCallback = null;
        function appConfirm(m) { return new Promise(r => { vibrate('medium'); document.getElementById('customConfirmText').innerText=m; document.getElementById('customConfirm').classList.remove('hidden'); confirmCallback=r; }); }
        function resolveConfirm(res) { document.getElementById('customConfirm').classList.add('hidden'); if(confirmCallback) confirmCallback(res); }

        document.addEventListener("DOMContentLoaded", () => {
            const isHE = (navigator.language || navigator.userLanguage).toLowerCase().startsWith('he');
            if(isHE) { document.documentElement.dir='rtl'; document.documentElement.lang='he'; }
            restoreSession();
            setInterval(autoSave, 2000);
        });

        function autoSave() {
            if(state.isRunning && state.currentRoom) {
                localStorage.setItem('hcl_draft_room', state.currentRoom);
                localStorage.setItem('hcl_draft_html', document.getElementById('issuesList').innerHTML);
            }
        }

        function restoreSession() {
            const s = localStorage.getItem('hcl_state_v2');
            if(s) {
                state = JSON.parse(s);
                if(state.isRunning) {
                    document.getElementById('headerInfo').innerText = `${state.inspector} | ${state.department}`;
                    updateInspectedUI(); navigate('inspectionPage');
                    const dr = localStorage.getItem('hcl_draft_room');
                    if(dr) {
                        state.currentRoom = dr; document.getElementById('currentRoomDisplay').innerText = dr;
                        document.getElementById('activeRoomBlock').classList.remove('hidden');
                        document.getElementById('issuesList').innerHTML = localStorage.getItem('hcl_draft_html') || "";
                        if(document.getElementById('issuesList').children.length > 0) {
                            document.getElementById('allGoodBtn').classList.add('hidden');
                            document.getElementById('saveRoomBtn').classList.remove('hidden');
                        }
                    }
                }
            }
        }

        async function startInspection() {
            const insp = document.getElementById('inspectorName').value.trim();
            const dept = document.getElementById('department').value.trim();
            if(!insp || !dept) return appAlert("מלא את כל השדות!");
            state.inspector = insp; state.department = dept; state.isRunning = true;
            document.getElementById('loader').classList.remove('hidden');
            try {
                const res = await fetch(`${API_URL}?action=getSettings`);
                const data = await res.json();
                state.categories = data.categories || {"כללי": ["חלון", "דלת"]};
            } catch(e) { state.categories = {"כללי": ["חלון", "דלת"]}; }
            localStorage.setItem('hcl_state_v2', JSON.stringify(state));
            document.getElementById('headerInfo').innerText = `${insp} | ${dept}`;
            navigate('inspectionPage'); document.getElementById('loader').classList.add('hidden');
        }

        function openRoom() {
            if(!document.getElementById('activeRoomBlock').classList.contains('hidden')) return appAlert("שמור קודם את החדר הפתוח!");
            const n = document.getElementById('roomName').value.trim(); if(!n) return;
            state.currentRoom = n; document.getElementById('currentRoomDisplay').innerText = n;
            document.getElementById('issuesList').innerHTML = '';
            document.getElementById('allGoodBtn').classList.remove('hidden');
            document.getElementById('saveRoomBtn').classList.add('hidden');
            document.getElementById('activeRoomBlock').classList.remove('hidden');
        }

        function addIssueRow() {
            document.getElementById('allGoodBtn').classList.add('hidden');
            document.getElementById('saveRoomBtn').classList.remove('hidden');
            const temp = document.getElementById('issueTemplate').content.cloneNode(true);
            const sel = temp.querySelector('.system-select');
            let opts = `<option value="" disabled selected>בחר מערכת...</option>`;
            for(let c in state.categories) {
                opts += `<optgroup label="${c}">`;
                state.categories[c].forEach(s => opts += `<option value="${s}">${s}</option>`);
                opts += `</optgroup>`;
            }
            opts += `<option value="OTHER">אחר...</option>`;
            sel.innerHTML = opts; document.getElementById('issuesList').appendChild(temp);
        }

        async function saveRoomData(isAllGood) {
            vibrate();
            // БЛОКИРОВКА ОТ ДУБЛЕЙ
            const sBtn = document.getElementById('saveRoomBtn');
            const aBtn = document.getElementById('allGoodBtn');
            sBtn.disabled = true; sBtn.style.opacity = "0.5";
            aBtn.disabled = true; aBtn.style.opacity = "0.5";

            const items = []; let log = [];
            if(!isAllGood) {
                const rows = document.querySelectorAll('.issue-row');
                for(let row of rows) {
                    let sys = row.querySelector('.system-select').value;
                    if(sys === 'OTHER') sys = row.querySelector('.custom-system-input').value.trim();
                    const r = row.querySelector('.rating-block').dataset.val;
                    const c = row.querySelector('.comment-text').value.trim();
                    if(!sys || !r || !c) { 
                        appAlert("נא למלא את כל השדות!"); 
                        sBtn.disabled = false; sBtn.style.opacity = "1";
                        aBtn.disabled = false; aBtn.style.opacity = "1";
                        return; 
                    }
                    items.push({name: sys, score: r, comment: c, photoBase64: row.querySelector('.photo-input').dataset.base64 || ""});
                    log.push(`• ${sys} (${r==1?"החלפה":"תיקון"})`);
                }
            } else { log.push("✅ הכל תקין"); }

            document.getElementById('loader').classList.remove('hidden');
            try {
                const res = await fetch(API_URL, {method:'POST', body: JSON.stringify({inspector:state.inspector, department:state.department, room:state.currentRoom, items:items})});
                localStorage.removeItem('hcl_draft_room'); localStorage.removeItem('hcl_draft_html');
                state.inspectedRooms[state.currentRoom] = log;
                localStorage.setItem('hcl_state_v2', JSON.stringify(state));
                updateInspectedUI();
                document.getElementById('activeRoomBlock').classList.add('hidden');
                document.getElementById('roomName').value = '';
            } catch(e) { appAlert("שגיאת רשת!"); }
            finally { 
                document.getElementById('loader').classList.add('hidden'); 
                sBtn.disabled = false; sBtn.style.opacity = "1";
                aBtn.disabled = false; aBtn.style.opacity = "1";
            }
        }

        function updateInspectedUI() {
            const div = document.getElementById('inspectedRoomsList'); div.innerHTML = '';
            Object.keys(state.inspectedRooms).forEach(r => {
                const b = document.createElement('button');
                b.className = "bg-indigo-100 px-3 py-1 rounded-lg text-sm";
                b.innerText = r; b.onclick = () => {
                    const h = state.inspectedRooms[r];
                    document.getElementById('roomDetailsDisplay').innerHTML = h.join('<br>');
                    document.getElementById('roomDetailsDisplay').classList.remove('hidden');
                };
                div.appendChild(b);
            });
        }

        async function handlePhoto(input) {
            const f = input.files[0]; if(!f) return;
            const r = new FileReader();
            r.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                    const scale = 800 / img.width; canvas.width = 800; canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, 800, canvas.height);
                    input.dataset.base64 = canvas.toDataURL('image/jpeg', 0.6);
                    input.closest('.issue-row').querySelector('.photo-indicator').classList.remove('hidden');
                };
                img.src = e.target.result;
            };
            r.readAsDataURL(f);
        }

        async function finishDepartment() {
            if(!Object.keys(state.inspectedRooms).length) return appAlert("לא נבדקו חדרים!");
            if(!(await appConfirm("לסיים ולשלוח?"))) return;
            document.getElementById('loader').classList.remove('hidden');
            try {
                const rep = `🏥 דוח מחלקה: ${state.department}\nבודק: ${state.inspector}\n\n` + JSON.stringify(state.inspectedRooms, null, 2);
                await fetch(API_URL, {method:'POST', body: JSON.stringify({action:"FINISH_DEPT", reportText: rep})});
                localStorage.clear(); location.reload();
            } catch(e) { appAlert("שגיאה!"); } finally { document.getElementById('loader').classList.add('hidden'); }
        }

        function navigate(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        function toggleIssue(h) { h.nextElementSibling.classList.toggle('hidden'); }
        function toggleCustomInput(s) { s.nextElementSibling.classList.toggle('hidden', s.value!=='OTHER'); }
        function setRating(b, v) { b.parentElement.dataset.val = v; b.parentElement.querySelectorAll('button').forEach(x => x.classList.remove('ring-4','ring-black')); b.classList.add('ring-4','ring-black'); }
        function updateIssueTitle(el) { /* Можно добавить логику обновления заголовка */ }
        function removeIssue(b, e) { e.stopPropagation(); b.closest('.issue-row').remove(); }
    </script>
</body>
</html>
